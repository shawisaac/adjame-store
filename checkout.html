<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/checkout.js" defer></script>
</head>
<body>

  <div class="checkout-container">

    <h1>Finaliser la commande</h1>

    <form id="checkout-form" class="coordonner">

      <input type="text" id="name" placeholder=" Nom complet" required>

      <input type="tel" id="phone" placeholder=" Téléphone" required>

      <input type="text" id="address" placeholder=" Adresse" required>

      <button type="submit">
        Commander
      </button>

    </form>

    <div class="checkouty-summar">

      <h2>Résumé commande</h2>

      <div id="checkout-items"></div>

      <h3 id="checkout-total" class="checkout-total"></h3>

    </div>

  </div>



</body>
</html>
